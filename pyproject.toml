[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myps"
version = "0.1.0"
description = "Magnetic Tape TDOA Sound Localization System (2-microphone simulation and analysis)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy==1.26.2",
    "scipy==1.11.1",
    "matplotlib==3.8.1",
    "pandas==2.2.2",
    "pyyaml==6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "black==24.1.0",
    "flake8==6.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
